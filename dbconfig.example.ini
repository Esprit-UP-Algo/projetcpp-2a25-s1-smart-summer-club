[database]
# driver peut être QSQLITE (par défaut) ou un pilote Qt disponible (QODBC, QOCI…)
driver=QSQLITE
# chemin du fichier SQLite (laissé vide = emplacement par défaut dans AppData)
path=
# Pour les pilotes réseau, vous pouvez renseigner soit un DSN, soit host/port/service.
dsn=
host=localhost
port=1521
service=XE
user=
password=

